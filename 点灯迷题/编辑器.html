<!DOCTYPE html>

<meta charset="UTF-8">
<title>点灯迷题 关卡编辑器</title>

    * { box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; user-select: none; }
    body { background:#14141c; color:#e8e8f0; margin:0; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    #header { display:flex; align-items:center; padding:8px 12px; background:#1e1e2a; border-bottom:1px solid #33334a; flex-shrink:0; gap:8px; flex-wrap:wrap; }
    #header label { font-size:12px; color:#9a9ab0; display:flex; align-items:center; gap:5px; }
    #header input, #header select, #header button { background:#2a2a3a; color:#e8e8f0; border:1px solid #44445c; padding:4px 8px; border-radius:4px; font-size:12px; }
    #header button { cursor:pointer; background:#3f5f8f; border-color:#4f6f9f; }
    #header button:hover { background:#4f6f9f; }
    #header button.ghost { background:#2a2a3a; border-color:#44445c; }
    #header .sep { width:1px; height:22px; background:#33334a; margin:0 3px; }
    #header .num { font-family:Consolas,monospace; color:#ffc64d; font-size:13px; }
    #main { display:flex; flex:1; overflow:hidden; }
    #canvas-wrap { flex:1; position:relative; background:#0d0d14; overflow:hidden; }
    #canvas-wrap canvas { display:block; width:100%; height:100%; cursor:pointer; }
    #side { width:330px; background:#1e1e2a; padding:12px 14px; border-left:1px solid #33334a; overflow-y:auto; flex-shrink:0; font-size:12px; }
    #side h3 { margin:0 0 8px; color:#8ab4f8; border-bottom:1px solid #33334a; padding-bottom:5px; font-size:13px; }
    .row { display:flex; align-items:center; margin:6px 0; gap:6px; }
    .row label { width:78px; flex-shrink:0; color:#9a9ab0; }
    .row input, .row textarea { flex:1; min-width:0; background:#2a2a3a; color:#e8e8f0; border:1px solid #44445c; padding:4px 6px; border-radius:4px; font-size:12px; }
    .row textarea { height:52px; resize:vertical; font-family:Consolas,monospace; }
    .badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px; }
    .ok { background:#1f3a2b; color:#8fe0a8; border:1px solid #2f5a3f; }
    .bad { background:#3a1f24; color:#f0a0a8; border:1px solid #5a2f38; }
    .warn { background:#3a3320; color:#f0d68f; border:1px solid #5a4f2f; }
    .tip { color:#6a6a85; font-size:11px; line-height:1.7; margin-top:8px; border-top:1px dashed #33334a; padding-top:8px; }
    .legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; }
    .legend span { display:flex; align-items:center; gap:5px; color:#9a9ab0; font-size:11px; }

<div id="header">
    <label>关卡 <select id="levelSelect"></select></label>
    <button id="addBtn">新建</button>
    <button id="dupBtn">复制</button>
    <button id="delBtn">删除</button>
    <span class="sep"></span>
    <label>名称 <input id="levelName" style="width:96px"></label>
    <label>步数 <span class="num" id="stepNum">1</span></label>
    <span class="sep"></span>
    <label>随机 <input id="randSteps" type="number" min="1" max="15" value="5" style="width:52px"> 步</label>
    <button id="randBtn">生成</button>
    <button class="ghost" id="optBtn">求最优解</button>
    <button class="ghost" id="clearBtn">清空</button>
    <span class="sep"></span>
    <button id="importBtn" class="ghost">导入</button>
    <button id="exportBtn">导出</button>
</div>

<div id="main">
    <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="side">
        <h3>关卡属性</h3>
        <div class="row"><label>关卡名</label><input id="pName"></div>
        <div class="row"><label>教程提示</label><textarea id="pTip" placeholder="可选：仅前 5 关教程关会用到"></textarea></div>
        <div class="row"><label>步数</label><span class="num" id="pSteps">-</span></div>
        <div class="row"><label>解序列</label><input id="pFlips" readonly></div>
        <div class="row"><button class="ghost" id="copyFlips" style="flex:1">复制解序列（0 基下标）</button></div>

        <h3>校验</h3>
        <div id="verdict"></div>

        <h3>说明</h3>
        <div class="legend">
            <span><i class="sw" style="background:#ffd966"></i>亮灯</span>
            <span><i class="sw" style="background:#2b3348"></i>熄灭</span>
            <span><i class="sw" style="background:#ffc64d;border-color:#ffc64d"></i>解序列点位</span>
            <span><i class="sw" style="background:#ff9e3d"></i>受牵动的邻居</span>
        </div>
        <div class="tip">
            棋盘固定 <b>5 行 × 6 列</b>，一维下标 <b>idx = 行 × 6 + 列</b>（行从上往下 0..4，列从左往右 0..5）。<br>
            <b>左键点格子</b>＝把这个点位加入 / 移出解序列；画布上格内数字是「按下的顺序」。<br>
            初始盘面由「对全灭盘依次按下解序列」反推得到，所以按解序列各按一次必然全灭。<br>
            右侧「校验」会用高斯消元求出该盘面的<b>唯一解</b>并与当前解序列比对 —— 一致才是<b>最优解</b>。<br>
            导出的 Lua 可直接整段替换 <code>config.lua</code> 里 <code>LEVELS_BEGIN / LEVELS_END</code> 之间的内容。
        </div>
    </div>
</div>

<div id="modal">
    <div class="box">
        <h3 id="modalTitle">导出</h3>
        <textarea id="modalText" spellcheck="false"></textarea>
        <div class="btns">

const ROWS = DEFAULTS.rows, COLS = DEFAULTS.cols, N = ROWS * COLS;

// ================================================================
// ★ 与 puzzle.lua 完全同构的棋盘模型
// ================================================================
const PRESS = [];                     // PRESS[idx] = 按下该格牵动的位掩码（含自己）
for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
        let m = 1 << (r * COLS + c);
        [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) m |= 1 << (nr * COLS + nc);
        });
        PRESS.push(m);
    }
}
const bit = (i) => 1 << i;
const popcount = (m) => { let n = 0; while (m) { m &= m - 1; n++; } return n; };
const bitsOf = (m) => { const out = []; for (let i = 0; i < N; i++) if (m & bit(i)) out.push(i); return out; };
const maskOf = (arr) => arr.reduce((a, i) => a | bit(i), 0);

// 由解序列反推初始盘面
function boardOf(flips) {
    let b = 0;
    flips.forEach((i) => { b ^= PRESS[i]; });
    return b;
}

// 求某盘面的唯一解（高斯消元 / GF(2)）。矩阵对称，故第 i 行即 PRESS[i]。
function solveBoard(board) {
    const rows = [];
    for (let r = 0; r < N; r++) rows.push({ mask: PRESS[r], rhs: (board >> r) & 1 });
    const pivot = new Array(N).fill(-1);
    let pr = 0;
    for (let col = 0; col < N && pr < N; col++) {
        let sel = -1;
        for (let i = pr; i < N; i++) if (rows[i].mask & bit(col)) { sel = i; break; }
        if (sel < 0) continue;
        const t = rows[pr]; rows[pr] = rows[sel]; rows[sel] = t;
        for (let i = 0; i < N; i++) {
            if (i !== pr && (rows[i].mask & bit(col))) {
                rows[i].mask ^= rows[pr].mask;
                rows[i].rhs ^= rows[pr].rhs;
            }
        }
        pivot[col] = pr; pr++;
    }
    let free = 0;
    for (let c = 0; c < N; c++) if (pivot[c] < 0) free++;
    const sol = new Array(N).fill(0);
    for (let col = 0; col < N; col++) {
        if (pivot[col] >= 0 && rows[pivot[col]].mask === bit(col)) sol[col] = rows[pivot[col]].rhs;
    }
    return { sol, free };
}

// 随机生成一个「最优解恰为 k 步」的关卡
function randomLevel(k, rng) {
    for (let attempt = 0; attempt < 40000; attempt++) {
        const pool = Array.from({ length: N }, (_, i) => i);
        const picks = [];
        for (let i = 0; i < k; i++) {
            const j = Math.floor(rng() * pool.length);
            picks.push(pool.splice(j, 1)[0]);
        }
        const board = boardOf(picks);
        if (board === 0) continue;
        const { sol, free } = solveBoard(board);
        if (free !== 0) continue;
        const solList = sol.map((v, i) => v ? i : -1).filter((i) => i >= 0);
        if (solList.length !== k) continue;
        if (popcount(board) < Math.max(3, k)) continue;
        return solList.sort((a, b) => a - b);
    }
    return null;
}

// 确定性伪随机（同一 seed 生成同一批关卡，便于复现）
function makeRng(seed) {
    let s = seed >>> 0;
    return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
    };
}

let levels = [];
let curLevel = 0;
let hover = -1;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("canvas-wrap");

function defaultLevel(idx) {
    const rng = makeRng(idx * 7919 + 13);
    const flips = randomLevel(1, rng) || [0];
    return { name: "第" + String(idx).padStart(2, "0") + "关", tip: "", flips: flips };
}

// ================================================================
// 关卡列表 / 头部同步
// ================================================================
function refreshLevelSelect() {
    const sel = document.getElementById("levelSelect");
    sel.innerHTML = "";
    levels.forEach((lv, i) => {
        const o = document.createElement("option");
        o.value = i;
        o.textContent = "第" + String(i + 1).padStart(2, "0") + "关 · " + (lv.name || "") + " · " + lv.flips.length + "步";
        sel.appendChild(o);
    });
    sel.value = curLevel;
}

function selectLevel(i) {
    curLevel = Math.max(0, Math.min(levels.length - 1, i));
    refreshLevelSelect();
    syncHeader();
    draw();
}

function syncHeader() {
    const lv = levels[curLevel];
    if (!lv) return;
    document.getElementById("levelName").value = lv.name || "";
    document.getElementById("stepNum").textContent = lv.flips.length;
    document.getElementById("pName").value = lv.name || "";
    document.getElementById("pTip").value = lv.tip || "";
    document.getElementById("pSteps").textContent = lv.flips.length;
    document.getElementById("pFlips").value = "{" + lv.flips.join(", ") + "}";
    updateVerdict();
}

function updateVerdict() {
    const lv = levels[curLevel];
    const box = document.getElementById("verdict");
    if (!lv) { box.innerHTML = ""; return; }
    if (!lv.flips.length) {
        box.innerHTML = '<span class="badge warn">空解序列 —— 这关开局就是全灭（不会有人能「玩」）</span>';
        return;
    }
    const board = boardOf(lv.flips);
    if (board === 0) {
        box.innerHTML = '<span class="badge bad">解序列互相抵消，初始盘面为空 —— 请调整</span>';
        return;
    }
    const { sol, free } = solveBoard(board);
    const solList = sol.map((v, i) => v ? i : -1).filter((i) => i >= 0);
    const mine = [...lv.flips].sort((a, b) => a - b);
    const equal = solList.length === mine.length && solList.every((v, i) => v === mine[i]);
    if (equal) {
        box.innerHTML =
            `<span class="badge ok">✔ 解正确且最优</span><br>` +
            `<span style="color:#9a9ab0">初始盘面亮灯 <b>${popcount(board)}</b> 盏` +
            ` · 唯一解 <b>${solList.length}</b> 步 · 核空间维数 ${free}</span>`;
    } else {
        box.innerHTML =
            `<span class="badge bad">✘ 当前解不是最优解</span><br>` +
            `<span style="color:#f0a0a8">该盘面的唯一解是 {${solList.join(", ")}}（${solList.length} 步）</span><br>` +
            `<button class="ghost" id="fixBtn" style="margin-top:6px">一键改为最优解</button>`;
        const fb = document.getElementById("fixBtn");
        if (fb) fb.addEventListener("click", () => {
            lv.flips = solList;
            syncHeader(); draw();
        });
    }
}

// ================================================================
// 绘制
// ================================================================
function draw() {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, W, H);

    const lv = levels[curLevel];
    if (!lv) return;
    const board = boardOf(lv.flips);
    const flipSet = new Set(lv.flips);
    const orderOf = new Map();
    lv.flips.forEach((idx, i) => orderOf.set(idx, i + 1));

    const cell = 62, gap = 12;
    const bw = COLS * cell + (COLS - 1) * gap;
    const bh = ROWS * cell + (ROWS - 1) * gap;
    const ox = (W - bw) / 2, oy = (H - bh) / 2 + 10;

    // 标题
    ctx.fillStyle = PAL.dim;
    ctx.font = '13px "Microsoft YaHei"';
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText(`第 ${String(curLevel + 1).padStart(2, "0")} 关 · ${lv.name || ""} · ${lv.flips.length} 步 · 亮灯 ${popcount(board)} 盏`, 16, 12);
    ctx.fillText("左键点格子 = 加入 / 移出解序列（格内数字 = 按下顺序）", 16, 32);

    // 棋盘
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const idx = r * COLS + c;
            const x = ox + c * (cell + gap), y = oy + r * (cell + gap);
            const lit = (board >> idx) & 1;
            const inSet = flipSet.has(idx);
            ctx.fillStyle = inSet ? PAL.accent : (lit ? PAL.lit : PAL.unlit);
            ctx.fillRect(x, y, cell, cell);
            ctx.strokeStyle = idx === hover ? "#fff" : PAL.line;
            ctx.lineWidth = idx === hover ? 2 : 1;
            ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
            // 格内文字
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            if (inSet) {
                ctx.fillStyle = "#2a1e00";
                ctx.font = 'bold 22px Consolas, monospace';
                ctx.fillText(String(orderOf.get(idx)), x + cell / 2, y + cell / 2 - 6);
                ctx.font = '11px Consolas, monospace';
                ctx.fillText("idx " + idx, x + cell / 2, y + cell / 2 + 16);
            } else {
                ctx.fillStyle = lit ? "#5a4410" : "#4b5470";
                ctx.font = '11px Consolas, monospace';
                ctx.fillText("idx " + idx, x + cell / 2, y + cell / 2);
            }
        }
    }
}

function hitCell(mx, my) {
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const cell = 62, gap = 12;
    const bw = COLS * cell + (COLS - 1) * gap;
    const bh = ROWS * cell + (ROWS - 1) * gap;
    const ox = (W - bw) / 2, oy = (H - bh) / 2 + 10;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x = ox + c * (cell + gap), y = oy + r * (cell + gap);
            if (mx >= x && mx <= x + cell && my >= y && my <= y + cell) return r * COLS + c;
        }
    }
    return -1;
}

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const h = hitCell(e.clientX - rect.left, e.clientY - rect.top);
    if (h !== hover) { hover = h; draw(); }
});
canvas.addEventListener("mouseleave", () => { hover = -1; draw(); });
canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    const rect = canvas.getBoundingClientRect();
    const idx = hitCell(e.clientX - rect.left, e.clientY - rect.top);
    if (idx < 0) return;
    const lv = levels[curLevel];
    const p = lv.flips.indexOf(idx);
    if (p >= 0) lv.flips.splice(p, 1);
    else { lv.flips.push(idx); lv.flips.sort((a, b) => a - b); }
    syncHeader(); refreshLevelSelect(); draw();
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
}

// ================================================================
// Lua 生成 / 解析
//   ★ LUA_IO_BEGIN / LUA_IO_END 之间的内容是「纯函数」，被
//     _verify_levels.mjs 原样抽出做导入导出往返校验，勿在这段里碰 DOM。
// ================================================================
// >>> LUA_IO_BEGIN
const q = (s) => '"' + String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';

function generateLua() {
    const out = [];
    out.push("M.LEVELS = {");
    levels.forEach((lv, i) => {
        const tag = (i + 1 <= 5) ? "教程" : "挑战";
        out.push(`    -- ===== 第${String(i + 1).padStart(2, "0")}关（${tag} · ${lv.flips.length} 步）=====`);
        out.push("    {");
        out.push(`        name = ${q(lv.name || ("第" + String(i + 1).padStart(2, "0") + "关"))},`);
        out.push(`        steps = ${lv.flips.length},`);
        if (lv.tip) out.push(`        tip = ${q(lv.tip)},`);
        out.push(`        flips = {${lv.flips.join(", ")}},`);
        out.push("    },");
    });
    out.push("}");
    return out.join("\n");
}

function parseLuaLevels(text) {
    const m = text.match(/M\.LEVELS\s*=\s*\{([\s\S]*)\}/);
    const body = m ? m[1] : text;
    const chunks = [];
    let depth = 0, cur = "", inStr = false, esc = false;
    for (let i = 0; i < body.length; i++) {
        const ch = body[i];
        cur += ch;
        if (inStr) {
            if (esc) esc = false;
            else if (ch === "\\") esc = true;
            else if (ch === '"') inStr = false;
            continue;
        }
        if (ch === '"') { inStr = true; continue; }
        if (ch === "{") depth++;
        else if (ch === "}") { depth--; if (depth === 0) { chunks.push(cur); cur = ""; } }
    }
    const out = [];
    chunks.forEach((ck) => {
        const nm = ck.match(/name\s*=\s*"([^"]*)"/);
        const tp = ck.match(/tip\s*=\s*"([^"]*)"/);
        const fl = ck.match(/flips\s*=\s*\{([^}]*)\}/);
        if (!fl) return;
        const nums = (fl[1].match(/-?\d+/g) || []).map(Number).filter((v) => v >= 0 && v < N);
        const uniq = Array.from(new Set(nums)).sort((a, b) => a - b);
        out.push({ name: nm ? nm[1] : "", tip: tp ? tp[1] : "", flips: uniq });
    });
    return out;
}
// <<< LUA_IO_END

// ================================================================
// 初始化
// ================================================================
function init() {
    levels = INIT_LEVELS.map((lv, i) => ({
        name: lv.name || ("第" + String(i + 1).padStart(2, "0") + "关"),
        tip: lv.tip || "",
        flips: Array.from(new Set(lv.flips || [])).sort((a, b) => a - b),
    }));
    if (!levels.length) levels = [defaultLevel(1)];
    refreshLevelSelect();
    syncHeader();
    resize();
    window.addEventListener("resize", resize);
}
